<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team - StratoBusters</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo.png" alt="StratoBusters" class="logo-img">
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" data-translate-nav="home">Home</a></li>
                <li><a href="about.html" data-translate-nav="about">O projekcie</a></li>
                <li><a href="team.html" class="active" data-translate-nav="team">Drużyna</a></li>
                <li><a href="updates.html" data-translate-nav="updates">Nowości</a></li>
                <li><a href="gallery.html" data-translate-nav="gallery">Galeria</a></li>
                <li><a href="contact.html" data-translate-nav="contact">Kontakt</a></li>
            </ul>
            <div class="nav-controls">
                <select id="languageSelect" class="language-select" aria-label="Select language">
                    <option value="pl">🇵🇱 PL</option>
                    <option value="en">🇬🇧 EN</option>
                </select>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
            <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main>
        <!-- Animated Background Elements -->
        <div class="background-elements">
            <!-- Dark Mode Elements -->
            <div class="bg-dark-mode">
                <div class="moon"></div>
                <div class="star star-1"></div>
                <div class="star star-2"></div>
                <div class="star star-3"></div>
                <div class="star star-4"></div>
                <div class="star star-5"></div>
                <div class="star star-6"></div>
                <div class="star star-7"></div>
                <div class="star star-8"></div>
                <div class="star star-9"></div>
                <div class="star star-10"></div>
                <div class="shooting-star shooting-star-1" id="shootingStar1"></div>
                <div class="shooting-star shooting-star-2" id="shootingStar2"></div>
                <div class="shooting-star shooting-star-3" id="shootingStar3"></div>
                <div class="shooting-star shooting-star-4" id="shootingStar4"></div>
                <div class="shooting-star shooting-star-5" id="shootingStar5"></div>
                <div class="rocket rocket-dark"></div>
            </div>
            <!-- Light Mode Elements -->
            <div class="bg-light-mode">
                <div class="sun"></div>
                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
                <div class="cloud cloud-3"></div>
                <div class="cloud cloud-4"></div>
                <div class="rocket rocket-light"></div>
            </div>
        </div>
        <section class="page-header">
            <div class="container">
                <h1 data-translate="team.title">Our Team</h1>
                <p class="page-subtitle" data-translate="team.subtitle">The People Behind StratoBusters</p>
            </div>
        </section>

        <section class="content-section">
            <div class="container">
                <div class="team-grid" id="teamGrid">
                    <!-- Team members will be loaded dynamically from team.json -->
                    <div class="loading">Loading team information...</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>
                <span data-translate="footer.copyright">© 2025/2026 StratoBusters. Strona zaprojektowana przez</span>
                <a href="https://github.com/SciMon183" data-translate="footer.designedBy">Szymona Jagiełło</a>.
            </p>
        </div>
    </footer>

    <script src="js/translations.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/language.js"></script>
    <script src="js/team.js"></script>
    <script src="js/shooting-star.js"></script>
</body>
</html>
